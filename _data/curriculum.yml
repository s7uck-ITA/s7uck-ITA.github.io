    title: "AEDE - Ambasciatori d'Europa 2018"
    place: "Ceglie Messapica"
    desc: "Primo premio \"Giuseppe Tramarollo\" scuole primarie e attestato di merito eccezionale. L'obiettivo del concorso era immaginare un percorso attraverso il quale potesse realizzarsi una vera unione europea. Ho partecipato presentando il logo e il video promo, in lingua inglese, di un'ipotetica tv europea \"eu 1 tv\" con palinsesti che incentivassero nei cittadini un sentimento di appartenenza e fratellanza europea."
