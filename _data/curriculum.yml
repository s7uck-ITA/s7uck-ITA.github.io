    title: "Premio \"Alessandro Leogrande\""
    place: "Taranto"
    desc: "Il premio \"Alessandro Leogrande\", intitolato a un giornalista mio concittadino scomparso nel 2017, è un premio rilasciato su base annuale a libri di giornalismo narrativo. Quest'anno ho partecipato alla votazione leggendo \"Quando il mondo dorme\" di Francesca Albanese, relatrice ONU per la questione palestinese, e ho contribuito nel mio piccolo alla sua premiazione."
