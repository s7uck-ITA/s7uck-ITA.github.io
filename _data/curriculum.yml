- id: sociale
  title: "Attività sociali e politiche"
  rows:
  - years: 2026
    h: "Premio \"Alessandro Leogrande\""
    place: "Taranto"
    text: >-
      Il premio "Alessandro Leogrande", intitolato a un giornalista mio concittadino
      scomparso nel 2017, è un premio rilasciato su base annuale a libri di giornalismo
      narrativo. Quest'anno ho partecipato alla votazione leggendo "Quando il mondo dorme"
      di Francesca Albanese, relatrice ONU per la questione palestinese, e ho contribuito nel
      mio piccolo alla sua premiazione.
    link: ["Altri dettagli", "/showcase/leogrande.html"]
  - years: 2017
    h: "AEDE - Ambasciatori d'Europa 2018"
    place: "Ceglie Messapica"
    text: >-
      Primo premio "Giuseppe Tramarollo" scuole primarie e attestato di merito eccezionale.
      L'obiettivo del concorso era immaginare un percorso attraverso il quale potesse
      realizzarsi una vera unione europea. Ho partecipato presentando il logo e il video
      promo, in lingua inglese, di un'ipotetica tv europea "eu 1 tv" con palinsesti che
      incentivassero nei cittadini un sentimento di appartenenza e fratellanza europea.
    link: ["Altri dettagli", ""]

